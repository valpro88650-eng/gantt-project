<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Projets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-gray-800">📋 Mon Projet en un Coup d'Œil</h1>
    <select id="project-select" onchange="loadTasks()" class="border p-2 rounded bg-gray-50">
      <option value="">Chargement...</option>
    </select>
  </header>

  <div class="max-w-7xl mx-auto mt-6 px-4">
    <div class="flex border-b border-gray-300 mb-6">
      <button onclick="switchTab('list')" id="tab-list" class="py-2 px-4 font-semibold text-blue-600 border-b-2 border-blue-600">📋 Liste</button>
      <button onclick="switchTab('kanban')" id="tab-kanban" class="py-2 px-4 font-semibold text-gray-500 hover:text-blue-600">📊 Kanban</button>
      <button onclick="switchTab('gantt')" id="tab-gantt" class="py-2 px-4 font-semibold text-gray-500 hover:text-blue-600">📅 Diagramme de Gantt</button>
    </div>

    <!-- VUE LISTE -->
    <div id="view-list" class="space-y-4">
      <div class="flex justify-between items-center bg-white p-4 rounded shadow">
        <h2 class="text-lg font-bold">Tâches du projet</h2>
        <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ Nouvelle tâche</button>
      </div>
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b">
              <th class="p-3">Tâche</th>
              <th class="p-3">Responsable</th>
              <th class="p-3">Début</th>
              <th class="p-3">Fin</th>
              <th class="p-3">Statut</th>
              <th class="p-3">Avancement</th>
              <th class="p-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="task-list-body"></tbody>
        </table>
      </div>
    </div>

    <!-- VUE KANBAN (AVEC DRAG & DROP) -->
    <div id="view-kanban" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-gray-200 p-4 rounded shadow" ondragover="allowDrop(event)" ondrop="drop(event, 'À faire')">
        <h3 class="font-bold text-gray-700 mb-3">À faire</h3>
        <div id="kanban-todo" class="space-y-2 min-h-[200px]"></div>
      </div>
      <div class="bg-blue-100 p-4 rounded shadow" ondragover="allowDrop(event)" ondrop="drop(event, 'En cours')">
        <h3 class="font-bold text-blue-800 mb-3">En cours</h3>
        <div id="kanban-doing" class="space-y-2 min-h-[200px]"></div>
      </div>
      <div class="bg-green-100 p-4 rounded shadow" ondragover="allowDrop(event)" ondrop="drop(event, 'Terminé')">
        <h3 class="font-bold text-green-800 mb-3">Terminé</h3>
        <div id="kanban-done" class="space-y-2 min-h-[200px]"></div>
      </div>
    </div>

    <!-- VUE GANTT -->
    <div id="view-gantt" class="hidden bg-white p-4 rounded shadow overflow-x-auto">
      <svg id="gantt-target"></svg>
    </div>
  </div>

  <!-- MODALE CRÉATION / ÉDITION -->
  <div id="modal-task" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-lg">
      <h3 id="modal-title" class="text-lg font-bold mb-4">Nouvelle tâche</h3>
      <form id="task-form" onsubmit="saveTask(event)" class="space-y-3">
        <input type="hidden" id="task-id">
        <div>
          <label class="block text-sm font-medium">Nom de la tâche</label>
          <input type="text" id="task-name" required class="w-full border p-2 rounded">
        </div>
        <div>
          <label class="block text-sm font-medium">Responsable</label>
          <input type="text" id="task-assignee" class="w-full border p-2 rounded">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-sm font-medium">Date début</label>
            <input type="date" id="task-start" required class="border p-2 rounded w-full">
          </div>
          <div>
            <label class="block text-sm font-medium">Date fin</label>
            <input type="date" id="task-end" required class="border p-2 rounded w-full">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-sm font-medium">Statut</label>
            <select id="task-status" class="w-full border p-2 rounded">
              <option value="À faire">À faire</option>
              <option value="En cours">En cours</option>
              <option value="Terminé">Terminé</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium">Avancement (%)</label>
            <input type="number" id="task-progress" min="0" max="100" value="0" class="w-full border p-2 rounded">
          </div>
        </div>
        <div class="flex justify-between items-center pt-4">
          <button type="button" id="btn-delete" onclick="deleteTask()" class="px-3 py-2 bg-red-100 text-red-600 rounded hover:bg-red-200 hidden">Supprimer</button>
          <div class="flex space-x-2 ml-auto">
            <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded">Annuler</button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Enregistrer</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
